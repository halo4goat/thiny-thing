# GdMacroMenu offsets for ONE specific build. Derived by static analysis of the GeometryDash.exe in
# Geometry_Dash.zip. NOT yet confirmed in a running game. If the menu reports a module size mismatch,
# your running exe is a different build and every value below is invalid for it.
#
# Evidence (all RVAs are relative to the module base; image base in the PE is 0x140000000):
#  - 0x90BFD0 is the GameManager singleton pointer: the GameManager constructor (RVA 0x275A10, object
#    size 0x6E8) result is stored there in the inlined sharedState pattern, and the GameManager
#    destructor (RVA 0x2880C0) writes 0 back to it.
#  - GameManager+0x230 is m_playLayer: PlayLayer's init stores 'this' there, and PlayLayer's
#    destructor clears it when it equals 'this'.
#  - PlayLayer+0xDB8 / +0xDC0 are the two player pointers: the GJBaseGameLayer constructor zeroes both,
#    and the function that calls PlayerObject::create twice stores the first result at +0xDB8 and the
#    second at +0xDC0. That +0xDB8 is player 1 is inferred from this creation order.
#  - PlayerObject+0x4C is the node X position: libcocos2d.dll's CCNode::getPositionX is
#    'movss xmm0,[rcx+0x4C]'. PlayerObject's primary vtable pointer sits at offset 0.
build_note=GeometryDash.exe sha256 4eee06d5c2e2213b4ba2b1f6233dd426bbdd0e9b29d7c375e499516b6f8f69d5, PE timestamp 2026-10-17 02:12:23 UTC, PE32+ x64, derived statically
module=GeometryDash.exe
# SizeOfImage from the PE header (13225984). Assumed equal to the loaded module size; the menu shows the observed value.
module_size=0xC9D000
player_x_base_rva=0x90BFD0
# GameManager* -> +0x230 PlayLayer* -> +0xDB8 PlayerObject* -> float X at +0x4C
player_x_chain=0x230,0xDB8,0x4C
